name: Sincronizar Protocolo MK

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar credencial de leitura do Alpha
        env:
          MK_PROTOCOL_READ_TOKEN: ${{ secrets.MK_PROTOCOL_READ_TOKEN }}
        run: |
          if [ -z "$MK_PROTOCOL_READ_TOKEN" ]; then
            echo "::error::Configure o segredo MK_PROTOCOL_READ_TOKEN com acesso somente de leitura ao repo privado alpha."
            exit 1
          fi

      - name: Ler protocolo mestre do repositório privado Alpha
        env:
          MK_PROTOCOL_READ_TOKEN: ${{ secrets.MK_PROTOCOL_READ_TOKEN }}
        run: |
          mkdir -p docs
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer $MK_PROTOCOL_READ_TOKEN" \
            --header 'Accept: application/vnd.github.raw+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/dudusltnmendes-star/alpha/contents/PROTOCOLO_MK_QUALIDADE.md?ref=main' \
            --output docs/PROTOCOLO_MK_QUALIDADE.md
          if ! grep -q '^# PROTOCOLO MK DE QUALIDADE' docs/PROTOCOLO_MK_QUALIDADE.md; then
            echo "::error::Resposta não corresponde ao protocolo mestre."
            exit 1
          fi

      - name: Propor atualização (sem merge automático)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/PROTOCOLO_MK_QUALIDADE.md && [ -f docs/PROTOCOLO_MK_QUALIDADE.md ] && git ls-files --error-unmatch docs/PROTOCOLO_MK_QUALIDADE.md >/dev/null 2>&1; then
            echo 'Protocolo já atualizado.'
            exit 0
          fi

          branch='automation/sync-mk-protocol'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add docs/PROTOCOLO_MK_QUALIDADE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: sincroniza protocolo MK com Alpha'
          git push --force-with-lease origin "$branch"
          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create --base main --head "$branch" \
              --title 'docs: atualizar Protocolo MK a partir do Alpha' \
              --body 'Sincronização automática do documento mestre privado do Alpha. Revisar antes do merge; nenhum código do aplicativo é alterado.'
          else
            echo 'PR de sincronização já existe e foi atualizado.'
          fi
